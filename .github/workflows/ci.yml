name: CI

on:
  push:
    branches: [main, feature/*, "00*"]
  pull_request:
    branches: [main]

jobs:
  validate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm validate

      - name: Build UnderUndre
        run: pnpm build:underundre

      - name: Run verification gates
        run: pnpm verify --brand underundre
        continue-on-error: true
