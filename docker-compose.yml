# UnderUndre landing — production stack (Caddy edge ingress).
# The `caddy` external network is created by undevops scripts/server/install-caddy.sh.
# Build args (NEXT_PUBLIC_*) are interpolated by docker compose from the .env
# file in this directory; runtime secrets (TELEGRAM_*) flow via env_file.

services:
  landing:
    build:
      context: .
      args:
        NEXT_PUBLIC_PROJECT_NAME: ${NEXT_PUBLIC_PROJECT_NAME:-underundre}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
        NEXT_PUBLIC_UMAMI_SRC: ${NEXT_PUBLIC_UMAMI_SRC:-}
        NEXT_PUBLIC_CAL_TRIAGE_URL: ${NEXT_PUBLIC_CAL_TRIAGE_URL:-}
        NEXT_PUBLIC_CONTACT_CHANNELS: ${NEXT_PUBLIC_CONTACT_CHANNELS:-}
        NEXT_PUBLIC_SOCIAL_GITHUB: ${NEXT_PUBLIC_SOCIAL_GITHUB:-}
        NEXT_PUBLIC_SOCIAL_TWITTER: ${NEXT_PUBLIC_SOCIAL_TWITTER:-}
        NEXT_PUBLIC_SOCIAL_TELEGRAM: ${NEXT_PUBLIC_SOCIAL_TELEGRAM:-}
        NEXT_PUBLIC_SOCIAL_YOUTUBE: ${NEXT_PUBLIC_SOCIAL_YOUTUBE:-}
        NEXT_PUBLIC_SOCIAL_REDDIT: ${NEXT_PUBLIC_SOCIAL_REDDIT:-}
        NEXT_PUBLIC_SOCIAL_DISCORD: ${NEXT_PUBLIC_SOCIAL_DISCORD:-}
        NEXT_PUBLIC_SOCIAL_LINKEDIN: ${NEXT_PUBLIC_SOCIAL_LINKEDIN:-}
        NEXT_PUBLIC_SOCIAL_UPWORK: ${NEXT_PUBLIC_SOCIAL_UPWORK:-}
        NEXT_PUBLIC_SOCIAL_TRAILBLAZER: ${NEXT_PUBLIC_SOCIAL_TRAILBLAZER:-}
        NEXT_PUBLIC_SOCIAL_SLACK: ${NEXT_PUBLIC_SOCIAL_SLACK:-}
        NEXT_PUBLIC_SOCIAL_INSTAGRAM: ${NEXT_PUBLIC_SOCIAL_INSTAGRAM:-}
    image: underundre-landing:latest
    container_name: underundre-landing
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    # No host ports — Caddy fronts this container via the `caddy` network.
    expose:
      - "3000"
    networks:
      - caddy
      - internal

  # ── Self-hosted analytics (moved from the home-server netcraze tunnel —
  # the tunnel blocks POST, killing beacon collection). First-party:
  # the landing serves /umami-tracker.js itself and rewrites /api/collect
  # to this container over the docker network. Dashboard is NOT public —
  # access via SSH tunnel: ssh -L 3001:127.0.0.1:3001 <vps> → localhost:3001.
  umami:
    image: ghcr.io/umami-software/umami:latest
    container_name: underundre-umami
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD in .env}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET in .env}
      COLLECT_API_ENDPOINT: /api/collect
    depends_on:
      umami-db:
        condition: service_healthy
    expose:
      - "3000"
    ports:
      # Dashboard loopback-only: reachable from the operator's machine via SSH
      # port-forward, never exposed publicly.
      - "127.0.0.1:3001:3000"
    networks:
      - caddy
      - internal
    healthcheck:
      # busybox wget in this image can't reach localhost — use node fetch.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/heartbeat').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5

  umami-db:
    image: postgres:15-alpine
    container_name: underundre-umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD in .env}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  caddy:
    external: true
  internal:

volumes:
  umami-db-data:
